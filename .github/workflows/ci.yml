name: CI

# Sólo manual. La cuenta de GitHub está bloqueada por facturación, así que
# cada push disparaba un job que moría en segundos sin ejecutar un solo paso
# y mandaba un correo de fallo. Verificación real: `npm run build && npm test`
# en local. Para reactivarlo, devuelve los disparadores `push`/`pull_request`.
on:
  workflow_dispatch:

jobs:
  build-test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install Tuist
        env:
          TUIST_VERSION: "4.39.0"
        run: |
          curl -Ls "https://install.tuist.io" | TUIST_VERSION="$TUIST_VERSION" bash
          tuist version

      - name: Generate workspace
        run: tuist generate --no-open

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
