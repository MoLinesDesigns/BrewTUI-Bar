version: 2
updates:
  # El package.json de la raíz solo transporta MARKETING_VERSION para Tuist:
  # no tiene dependencias ni lockfile, así que no hay ecosistema npm que
  # actualizar. Lo único versionado aquí son las actions de CI.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
